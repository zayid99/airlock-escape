<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Airlock Escape</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"><g id="map"></g><g id="props"></g></svg>
  <div id="hud">
    <div id="taskbar" title="Show/hide tasks"><div id="taskfill"></div><span>TASKS COMPLETED</span></div>
    <div id="tasks"></div>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <button id="use" tabindex="-1">USE</button>
  <div id="closeup">
    <svg id="cusvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
    <button id="cuclose" aria-label="Close">&#10005;</button>
  </div>
  <div id="msg"></div>
  <div id="screen"></div>
</div>
<div id="bar">
  <div id="inv"></div>
  <div id="invinfo"><span id="invname"></span><button id="inspect">INSPECT</button></div>
</div>
<script src="js/art.js"></script>
<script src="js/inventory.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/rooms.js"></script>
<script src="js/player.js"></script>
<script src="js/game.js"></script>
</body>
</html>
